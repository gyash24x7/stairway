<!doctype html>
<html lang="en">
<head>
	<meta charset="UTF-8"/>
	<link href="/stairway.svg" rel="icon" type="image/svg+xml"/>
	<meta content="width=device-width, initial-scale=1.0, viewport-fit=cover" name="viewport"/>
	<meta content="#F3F4F6" name="theme-color"/>
	<meta content="Card and board games to play with friends." name="description"/>
	<link href="/pwa/apple-touch-icon-180x180.png" rel="apple-touch-icon"/>
	<meta content="yes" name="mobile-web-app-capable"/>
	<meta content="yes" name="apple-mobile-web-app-capable"/>
	<meta content="default" name="apple-mobile-web-app-status-bar-style"/>
	<meta content="Stairway" name="apple-mobile-web-app-title"/>
	<title>Stairway</title>
	<script>
		( function () {
			const theme = localStorage.getItem( "theme" ) || "apple-light";
			const parts = theme.split( "-" );
			document.documentElement.dataset.themePending = theme;
			document.addEventListener( "DOMContentLoaded", function () {
				document.body.classList.add( parts[ 0 ], parts[ 1 ] );
			} );
		} )();
	</script>
</head>
<body>
<div id="root"></div>
<script src="/src/main.tsx" type="module"></script>
</body>
</html>
