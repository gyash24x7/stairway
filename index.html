<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<title>Stairway</title>
		<link rel="icon" href="/stairway.svg" />
		<script>
			// Apply the persisted theme/mode as body classes before first paint
			// to avoid a flash of the default theme.
			( function () {
				var theme = localStorage.getItem( "theme" ) || "apple-light";
				var parts = theme.split( "-" );
				document.documentElement.dataset.themePending = theme;
				document.addEventListener( "DOMContentLoaded", function () {
					document.body.classList.add( parts[ 0 ], parts[ 1 ] );
				} );
			} )();
		</script>
	</head>
	<body>
		<div id="root"></div>
		<script type="module" src="/src/main.tsx"></script>
	</body>
</html>
