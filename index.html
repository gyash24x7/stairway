<!doctype html>
<html lang="en">
<head>
	<meta charset="utf-8"/>
	<meta content="width=device-width, initial-scale=1" name="viewport"/>
	<title>Stairway</title>
	<link href="/stairway.svg" rel="icon"/>
	<script>
		( function () {
			const theme = localStorage.getItem( "theme" ) || "apple-light";
			const parts = theme.split( "-" );
			document.documentElement.dataset.themePending = theme;
			document.addEventListener( "DOMContentLoaded", function () {
				document.body.classList.add( parts[ 0 ], parts[ 1 ] );
			} );
		} )();
	</script>
</head>
<body>
<div id="root"></div>
<script src="/src/main.tsx" type="module"></script>
</body>
</html>
