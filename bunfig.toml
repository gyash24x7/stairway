[test]
root = "tests"

coverage = true
coverageReporter = ["text", "lcov"]
coverageDir = "coverage"

coverageSkipTestFiles = true
coveragePathIgnorePatterns = [
	"tests/_helpers/**",
	"src/shared/swish/errors.ts",
	"src/shared/swish/services.ts",
	"src/chat/shared/schema.ts"
]

[test.coverageThreshold]
lines = 0.90
functions = 0.65
